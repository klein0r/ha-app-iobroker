name: "ioBroker"
version: 0.0.21
stage: experimental
slug: iobroker
image: ghcr.io/klein0r/ha-app-iobroker-{arch}
description: Integration platform for the Internet of Things
url: >
  https://github.com/klein0r/ha-app-iobroker
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:iobroker
init: false
homeassistant: 2023.3.0
arch:
  - aarch64
  - amd64
options:
  admin_port: 8081
  apply_ha_settings: true
  install_hass_adapter: true
  install_mqtt_client_adapter: false
  install_mqtt_adapter: false
  extra_packages: []
schema:
  admin_port: int
  apply_ha_settings: bool
  install_hass_adapter: bool
  install_mqtt_client_adapter: bool
  install_mqtt_adapter: bool
  extra_packages:
    - str
services:
  - mqtt:want
hassio_api: true
homeassistant_api: true
host_network: true
usb: true
uart: true
udev: true
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_NICE
map:
  - ssl:ro
  - addon_config
  - share
backup: hot
backup_pre: "bash /opt/scripts/maintenance.sh on"
backup_post: "bash /opt/scripts/maintenance.sh off"
