configuration:
  admin_port:
    name: Admin-Port
    description: >-
      Port, auf dem die ioBroker Admin-Oberfläche erreichbar ist. Ändern,
      wenn ein anderer Dienst (z. B. n8n) Port 8081 bereits belegt. Das
      Ingress-Panel funktioniert unabhängig von dieser Einstellung.
  apply_ha_settings:
    name: Home Assistant Einstellungen übernehmen
    description: >-
      Überträgt Home Assistant Systemeinstellungen (Standort, Sprache, Währung,
      Standortname) bei jedem Start des Add-ons in die ioBroker system.config.
  install_hass_adapter:
    name: Home Assistant Adapter installieren
    description: >-
      Installiert den ioBroker.hass Adapter automatisch und konfiguriert ihn
      so, dass er sich über die interne Supervisor-API mit Home Assistant
      verbindet. Das Token wird bei jedem Start des Add-ons aktualisiert.
  install_mqtt_client_adapter:
    name: MQTT Client Adapter installieren
    description: >-
      Installiert den ioBroker MQTT Client Adapter automatisch und konfiguriert
      ihn so, dass er sich mit dem Home Assistant MQTT-Broker verbindet. Die
      Zugangsdaten werden bei jedem Start des Add-ons aktualisiert.
  install_mqtt_adapter:
    name: MQTT Adapter installieren
    description: >-
      Installiert den ioBroker MQTT Adapter automatisch und konfiguriert ihn
      so, dass er sich mit dem Home Assistant MQTT-Broker verbindet. Die
      Zugangsdaten werden bei jedem Start des Add-ons aktualisiert.
  extra_packages:
    name: Zusätzliche Pakete
    description: >-
      Liste zusätzlicher apt-Pakete, die bei jedem Start des Add-ons
      installiert werden (z. B. ffmpeg, curl). Die Pakete werden installiert,
      bevor ioBroker startet.
