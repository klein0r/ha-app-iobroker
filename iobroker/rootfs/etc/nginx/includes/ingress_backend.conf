# Common backend wiring for every ingress location. Only the Supervisor may talk to us.
allow   172.30.32.2;
deny    all;

# Included per location on purpose: nginx inherits proxy_set_header from the parent
# level ONLY when the current level declares none of its own. A single proxy_set_header
# inside a location silently drops the whole inherited set - including
# Accept-Encoding "", without which sub_filter cannot match a gzipped body.
include /etc/nginx/includes/proxy_params.conf;

proxy_pass http://backend;
