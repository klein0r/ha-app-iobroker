# ioBroker.admin >= 8.0.7 builds the WebSocket URL as `<protocol>://<host>:<port>` +
# `window.socketPath`, and serves an empty value when it sits at the root. Under HA
# ingress the browser is at /api/hassio_ingress/<token>/, so the socket would be dialled
# at the host root and fail. The token changes per session, so it cannot come from the
# admin instance's static reverse-proxy table - and the Supervisor does not send an
# X-Ingress-Path header either (see supervisor/api/ingress.py, _init_header). Let the
# page derive the prefix from its own URL instead. No regex, so no `$` for nginx to read
# as a variable.

# sub_filter cannot match inside a gzipped body, so ask upstream for plain text - but
# only here. Admin ships several MB of JS, and stripping Accept-Encoding for every
# request would push all of it uncompressed through the ingress hop.
proxy_set_header Accept-Encoding "";

sub_filter_once on;
sub_filter      "window.socketPath = '';" "window.socketPath = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);";

# A 304 carries no body for sub_filter to rewrite, so the browser would keep rendering
# its unfiltered copy.
proxy_set_header  If-None-Match "";
proxy_hide_header ETag;
add_header        Cache-Control "no-store" always;
